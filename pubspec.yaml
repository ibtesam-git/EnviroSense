name: envirosense
description: "A cross-platform Flutter app that connects to compatible ESP32 sensors over Bluetooth or local Wi‑Fi to display configurable live readings, alerts, and offline history."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  flutter_reactive_ble: ^5.6.0
  permission_handler: ^13.0.2
  device_info_plus: ^13.2.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
